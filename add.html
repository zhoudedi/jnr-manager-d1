<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加情侣信息</title>
    <link rel="stylesheet" href="add.css">
</head>
<body>
    <div class="container">
        <h1>添加情侣信息</h1>
        
        <form id="authForm" class="password-section">
            <div class="form-group">
                <label for="password">验证密码：</label>
                <input type="password" id="password" name="password" placeholder="请输入密码：xiaozhou" required autocomplete="new-password">
            </div>
            <button type="submit" class="submit-btn">验证密码</button>
        </form>
        
        <form id="addForm" class="hidden">
            <div class="form-group">
                <label>我的性别：</label>
                <div class="checkbox-group">
                    <input type="radio" id="genderMale" name="gender" value="male" required>
                    <label for="genderMale">男性</label>
                    <input type="radio" id="genderFemale" name="gender" value="female" required>
                    <label for="genderFemale">女性</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="myName">我的姓名：</label>
                <input type="text" id="myName" name="myName" placeholder="请输入您的姓名" required>
            </div>
            
            <div class="form-group">
                <label for="myQQ">我的QQ号码：</label>
                <input type="text" id="myQQ" name="myQQ" placeholder="请输入您的QQ号码" required>
            </div>
            
            <div class="form-group">
                <label for="myBirth">我的生日：</label>
                <input type="datetime-local" id="myBirth" name="myBirth" required>
            </div>
            
            <div class="partner-section">
                <h3>伴侣信息</h3>
                
                <div class="no-partner-checkbox">
                    <input type="checkbox" id="noPartner" name="noPartner" value="1" checked>
                    <label for="noPartner">我是单身（无伴侣）</label>
                </div>
                
                <div id="partnerInfo">
                    <div class="form-group">
                        <label for="partnerName">伴侣姓名：</label>
                        <input type="text" id="partnerName" name="partnerName" placeholder="请输入伴侣姓名">
                    </div>
                    
                    <div class="form-group">
                        <label for="partnerQQ">伴侣QQ号码：</label>
                        <input type="text" id="partnerQQ" name="partnerQQ" placeholder="请输入伴侣QQ号码">
                    </div>
                    
                    <div class="form-group">
                        <label for="partnerBirth">伴侣生日：</label>
                        <input type="datetime-local" id="partnerBirth" name="partnerBirth">
                    </div>
                    
                    <div class="form-group">
                        <label for="anniversary">恋爱纪念日：</label>
                        <input type="datetime-local" id="anniversary" name="anniversary">
                    </div>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">添加情侣信息</button>
        </form>
        
        <a href="index.html" class="back-btn hidden" id="backBtn">返回首页</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const authForm = document.getElementById('authForm');
            const addForm = document.getElementById('addForm');
            const backBtn = document.getElementById('backBtn');
            const noPartnerCheckbox = document.getElementById('noPartner');
            const partnerInfo = document.getElementById('partnerInfo');
            const submitBtn = document.getElementById('submitBtn');
            
            // 防重复提交标志
            let isSubmitting = false;
            
            // 使用你的 Worker URL 替换这里的地址
            const CF_API_URL = 'https://jnr-api.lvxin.xn--6qq986b3xl/api/add';
            
            // 密码验证
            authForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('password').value;
                
                if (password === 'xiaozhou') {
                    authForm.classList.add('hidden');
                    addForm.classList.remove('hidden');
                    backBtn.classList.remove('hidden');
                } else {
                    alert('密码错误，请重新输入');
                }
            });
            
            // 控制伴侣信息显示/隐藏
            noPartnerCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    partnerInfo.classList.add('hidden');
                } else {
                    partnerInfo.classList.remove('hidden');
                }
            });
            
            // 初始隐藏伴侣信息
            partnerInfo.classList.add('hidden');
            
            // 表单提交处理
            document.getElementById('addForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // 防重复提交检查
                if (isSubmitting) {
                    return;
                }
                
                const formData = new FormData(this);
                const gender = formData.get('gender');
                const myName = formData.get('myName');
                const myQQ = formData.get('myQQ');
                const myBirth = formData.get('myBirth');
                const noPartner = formData.get('noPartner') === '1';
                
                // 验证必填字段
                if (!myName) {
                    alert('请输入您的姓名');
                    return;
                }
                if (!myQQ) {
                    alert('请输入您的QQ号码');
                    return;
                }
                if (!myBirth) {
                    alert('请输入您的生日');
                    return;
                }
                
                // 如果不是单身，验证伴侣信息
                if (!noPartner) {
                    const partnerName = formData.get('partnerName');
                    const partnerQQ = formData.get('partnerQQ');
                    const partnerBirth = formData.get('partnerBirth');
                    const anniversary = formData.get('anniversary');
                    
                    if (!partnerName) {
                        alert('请输入伴侣姓名');
                        return;
                    }
                    if (!partnerQQ) {
                        alert('请输入伴侣QQ号码');
                        return;
                    }
                    if (!partnerBirth) {
                        alert('请输入伴侣生日');
                        return;
                    }
                    if (!anniversary) {
                        alert('请输入恋爱纪念日');
                        return;
                    }
                }
                
                const formatDate = (dateStr) => {
                    if (!dateStr) return '0000-00-00 00:00';
                    const date = new Date(dateStr);
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    return `${year}-${month}-${day} ${hours}:${minutes}`;
                };
                
                let newData;
                
                if (noPartner) {
                    if (gender === 'male') {
                        newData = {
                            male: {
                                name: myName,
                                qq: myQQ,
                                birth: formatDate(myBirth)
                            },
                            female: {
                                name: "未知女友",
                                qq: "0000000001",
                                birth: "0000-00-00 00:00"
                            },
                            anniversary: "00-00-00 00:00"
                        };
                    } else {
                        newData = {
                            male: {
                                name: "未知男友",
                                qq: "0000000001",
                                birth: "0000-00-00 00:00"
                            },
                            female: {
                                name: myName,
                                qq: myQQ,
                                birth: formatDate(myBirth)
                            },
                            anniversary: "00-00-00 00:00"
                        };
                    }
                } else {
                    const partnerName = formData.get('partnerName');
                    const partnerQQ = formData.get('partnerQQ');
                    const partnerBirth = formData.get('partnerBirth');
                    const anniversary = formData.get('anniversary');
                    
                    if (gender === 'male') {
                        newData = {
                            male: {
                                name: myName,
                                qq: myQQ,
                                birth: formatDate(myBirth)
                            },
                            female: {
                                name: partnerName,
                                qq: partnerQQ,
                                birth: formatDate(partnerBirth)
                            },
                            anniversary: formatDate(anniversary)
                        };
                    } else {
                        newData = {
                            male: {
                                name: partnerName,
                                qq: partnerQQ,
                                birth: formatDate(partnerBirth)
                            },
                            female: {
                                name: myName,
                                qq: myQQ,
                                birth: formatDate(myBirth)
                            },
                            anniversary: formatDate(anniversary)
                        };
                    }
                }
                
                // 设置提交状态，防止重复提交
                isSubmitting = true;
                const originalText = submitBtn.textContent;
                submitBtn.textContent = '添加中...';
                submitBtn.disabled = true;
                
                try {
                    const password = document.getElementById('password').value;
                    
                    // 创建带超时的fetch请求
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时
                    
                    const response = await fetch(`${CF_API_URL}?password=${encodeURIComponent(password)}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(newData),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('情侣信息添加成功！');
                        window.location.href = 'index.html';
                    } else {
                        alert('添加失败: ' + result.error);
                        // 重置提交状态
                        isSubmitting = false;
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        alert('请求超时，请检查网络连接后重试');
                    } else {
                        console.error('保存数据失败:', error);
                        alert('保存数据失败: ' + error.message);
                    }
                    // 重置提交状态
                    isSubmitting = false;
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
