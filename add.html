<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加情侣信息</title>
    <link rel="stylesheet" href="add.css">
</head>
<body>
    <div class="container">
        <h1>添加情侣信息</h1>
        <form id="coupleForm">
            <!-- 密码验证 -->
            <div class="form-group">
                <label for="password">验证密码：</label>
                <input type="password" id="password" name="password" placeholder="请输入管理员密码" required>
            </div>

            <!-- 我的信息 -->
            <div class="form-section">
                <h2>我的信息</h2>
                <div class="form-group">
                    <label>我的性别：</label>
                    <label><input type="radio" name="myGender" value="male" checked> 男性</label>
                    <label><input type="radio" name="myGender" value="female"> 女性</label>
                </div>
                <div class="form-group">
                    <label for="myName">我的姓名：</label>
                    <input type="text" id="myName" name="myName" placeholder="请输入您的姓名" required>
                </div>
                <div class="form-group">
                    <label for="myQQ">我的QQ号码：</label>
                    <input type="text" id="myQQ" name="myQQ" placeholder="请输入您的QQ号码" required>
                </div>
                <div class="form-group">
                    <label for="myBirth">我的生日：</label>
                    <input type="datetime-local" id="myBirth" name="myBirth" required>
                </div>
            </div>

            <!-- 伴侣信息 -->
            <div class="form-section">
                <h2>伴侣信息</h2>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="noPartner"> 我是单身（无伴侣）
                    </label>
                </div>
                <div id="partnerFields">
                    <div class="form-group">
                        <label for="partnerName">伴侣姓名：</label>
                        <input type="text" id="partnerName" name="partnerName" placeholder="请输入伴侣姓名">
                    </div>
                    <div class="form-group">
                        <label for="partnerQQ">伴侣QQ号码：</label>
                        <input type="text" id="partnerQQ" name="partnerQQ" placeholder="请输入伴侣QQ号码">
                    </div>
                    <div class="form-group">
                        <label for="partnerBirth">伴侣生日：</label>
                        <input type="datetime-local" id="partnerBirth" name="partnerBirth">
                    </div>
                    <div class="form-group">
                        <label for="anniversary">恋爱纪念日：</label>
                        <input type="datetime-local" id="anniversary" name="anniversary">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">添加情侣信息</button>
            <div class="loading" id="loading">正在添加中，请稍候...</div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <a href="index.html" class="btn-back">返回首页</a>
        </form>
    </div>

    <script>
        const noPartnerCheckbox = document.getElementById('noPartner');
        const partnerFields = document.getElementById('partnerFields');
        const myGenderRadios = document.querySelectorAll('input[name="myGender"]');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');
        const errorMessageDiv = document.getElementById('errorMessage');
        const successMessageDiv = document.getElementById('successMessage');
        let isSubmitting = false; // 防重复提交标志

        // 切换伴侣字段显示/隐藏
        noPartnerCheckbox.addEventListener('change', function() {
            if (this.checked) {
                partnerFields.style.display = 'none';
            } else {
                partnerFields.style.display = 'block';
            }
        });

        // 显示消息
        function showMessage(element, message, isError = true) {
            element.textContent = message;
            element.style.display = 'block';
            if (isError) {
                successMessageDiv.style.display = 'none';
            } else {
                errorMessageDiv.style.display = 'none';
            }
        }

        // 隐藏所有消息
        function hideAllMessages() {
            loadingDiv.style.display = 'none';
            errorMessageDiv.style.display = 'none';
            successMessageDiv.style.display = 'none';
        }

        // 表单提交处理
        document.getElementById('coupleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 防重复提交检查
            if (isSubmitting) {
                return;
            }
            
            hideAllMessages();
            
            const password = document.getElementById('password').value;
            const myName = document.getElementById('myName').value;
            const myQQ = document.getElementById('myQQ').value;
            const myBirth = document.getElementById('myBirth').value;
            const isNoPartner = noPartnerCheckbox.checked;

            // 验证必填字段
            if (!password) {
                showMessage(errorMessageDiv, '请输入管理员密码');
                return;
            }
            if (!myName) {
                showMessage(errorMessageDiv, '请输入您的姓名');
                return;
            }
            if (!myQQ) {
                showMessage(errorMessageDiv, '请输入您的QQ号码');
                return;
            }
            if (!myBirth) {
                showMessage(errorMessageDiv, '请输入您的生日');
                return;
            }

            let partnerName, partnerQQ, partnerBirth, anniversary;
            
            if (isNoPartner) {
                // 获取我的性别
                let myGender = 'male';
                myGenderRadios.forEach(radio => {
                    if (radio.checked) {
                        myGender = radio.value;
                    }
                });
                
                // 设置默认值
                partnerName = myGender === 'male' ? '未知女友' : '未知男友';
                partnerQQ = '0000000001';
                partnerBirth = '0000-00-00T00:00';
                anniversary = '0000-00-00T00:00';
            } else {
                // 验证伴侣信息
                partnerName = document.getElementById('partnerName').value;
                partnerQQ = document.getElementById('partnerQQ').value;
                partnerBirth = document.getElementById('partnerBirth').value;
                anniversary = document.getElementById('anniversary').value;
                
                if (!partnerName) {
                    showMessage(errorMessageDiv, '请输入伴侣姓名');
                    return;
                }
                if (!partnerQQ) {
                    showMessage(errorMessageDiv, '请输入伴侣QQ号码');
                    return;
                }
                if (!partnerBirth) {
                    showMessage(errorMessageDiv, '请输入伴侣生日');
                    return;
                }
                if (!anniversary) {
                    showMessage(errorMessageDiv, '请输入恋爱纪念日');
                    return;
                }
            }

            // 构建请求数据
            const requestData = {
                male: {
                    name: '',
                    qq: '',
                    birth: ''
                },
                female: {
                    name: '',
                    qq: '',
                    birth: ''
                },
                anniversary: anniversary
            };

            // 确定性别分配
            let myGender = 'male';
            myGenderRadios.forEach(radio => {
                if (radio.checked) {
                    myGender = radio.value;
                }
            });

            if (myGender === 'male') {
                requestData.male = {
                    name: myName,
                    qq: myQQ,
                    birth: myBirth
                };
                requestData.female = {
                    name: partnerName,
                    qq: partnerQQ,
                    birth: partnerBirth
                };
            } else {
                requestData.female = {
                    name: myName,
                    qq: myQQ,
                    birth: myBirth
                };
                requestData.male = {
                    name: partnerName,
                    qq: partnerQQ,
                    birth: partnerBirth
                };
            }

            // 设置提交状态
            isSubmitting = true;
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch(`https://jnr-api.lvxin.xn--6qq986b3xl/api/add?password=${encodeURIComponent(password)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();
                
                if (result.success) {
                    showMessage(successMessageDiv, '添加成功！', false);
                    // 2秒后跳转到首页
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showMessage(errorMessageDiv, '添加失败：' + (result.error || '未知错误'));
                    // 重置提交状态，允许重新提交
                    isSubmitting = false;
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                showMessage(errorMessageDiv, '网络错误：' + error.message);
                // 重置提交状态，允许重新提交
                isSubmitting = false;
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
