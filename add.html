<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加情侣信息</title>
    <link rel="stylesheet" href="add.css">
</head>
<body>
    <h1>添加情侣信息</h1>
    
    <!-- 密码验证弹窗 -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>验证密码</h2>
            <input type="password" id="adminPassword" placeholder="请输入管理员密码">
            <button onclick="verifyPassword()">确认</button>
        </div>
    </div>

    <!-- 表单（初始隐藏） -->
    <form id="coupleForm" style="display: none;">
        <!-- 我的信息 -->
        <div class="form-section">
            <h2>我的信息</h2>
            <div class="form-group">
                <label>我的性别：</label>
                <label><input type="radio" name="myGender" value="male" checked> 男性</label>
                <label><input type="radio" name="myGender" value="female"> 女性</label>
            </div>
            <div class="form-group">
                <label for="myName">我的姓名：</label>
                <input type="text" id="myName" name="myName" placeholder="请输入您的姓名" required>
            </div>
            <div class="form-group">
                <label for="myQQ">我的QQ号码：</label>
                <input type="text" id="myQQ" name="myQQ" placeholder="请输入您的QQ号码" required>
            </div>
            <div class="form-group">
                <label for="myBirth">我的生日：</label>
                <input type="datetime-local" id="myBirth" name="myBirth" required>
            </div>
        </div>

        <!-- 伴侣信息 -->
        <div class="form-section">
            <h2>伴侣信息</h2>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="noPartner"> 我是单身（无伴侣）
                </label>
            </div>
            <div id="partnerFields">
                <div class="form-group">
                    <label for="partnerName">伴侣姓名：</label>
                    <input type="text" id="partnerName" name="partnerName" placeholder="请输入伴侣姓名">
                </div>
                <div class="form-group">
                    <label for="partnerQQ">伴侣QQ号码：</label>
                    <input type="text" id="partnerQQ" name="partnerQQ" placeholder="请输入伴侣QQ号码">
                </div>
                <div class="form-group">
                    <label for="partnerBirth">伴侣生日：</label>
                    <input type="datetime-local" id="partnerBirth" name="partnerBirth">
                </div>
                <div class="form-group">
                    <label for="anniversary">恋爱纪念日：</label>
                    <input type="datetime-local" id="anniversary" name="anniversary">
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">添加情侣信息</button>
        <a href="index.html" class="btn-back">返回首页</a>
    </form>

    <script>
        // 全局变量
        let adminPassword = '';
        let isSubmitting = false;

        // 显示密码弹窗
        document.getElementById('passwordModal').style.display = 'block';

        // 关闭弹窗
        document.querySelector('.close').onclick = function() {
            document.getElementById('passwordModal').style.display = 'none';
        };

        // 验证密码
        function verifyPassword() {
            const passwordInput = document.getElementById('adminPassword');
            if (passwordInput.value.trim() === '') {
                alert('请输入密码');
                return;
            }
            adminPassword = passwordInput.value;
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('coupleForm').style.display = 'block';
        }

        // 切换伴侣字段显示/隐藏
        document.getElementById('noPartner').addEventListener('change', function() {
            const partnerFields = document.getElementById('partnerFields');
            if (this.checked) {
                partnerFields.style.display = 'none';
            } else {
                partnerFields.style.display = 'block';
            }
        });

        // 表单提交处理
        document.getElementById('coupleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 防重复提交
            if (isSubmitting) {
                return;
            }

            const myName = document.getElementById('myName').value;
            const myQQ = document.getElementById('myQQ').value;
            const myBirth = document.getElementById('myBirth').value;
            const isNoPartner = document.getElementById('noPartner').checked;

            // 验证必填字段
            if (!myName) {
                alert('请输入您的姓名');
                return;
            }
            if (!myQQ) {
                alert('请输入您的QQ号码');
                return;
            }
            if (!myBirth) {
                alert('请输入您的生日');
                return;
            }

            let partnerName, partnerQQ, partnerBirth, anniversary;
            
            if (isNoPartner) {
                // 获取我的性别
                let myGender = 'male';
                document.querySelectorAll('input[name="myGender"]').forEach(radio => {
                    if (radio.checked) {
                        myGender = radio.value;
                    }
                });
                
                // 设置默认值
                partnerName = myGender === 'male' ? '未知女友' : '未知男友';
                partnerQQ = '0000000001';
                partnerBirth = '0000-00-00T00:00';
                anniversary = '0000-00-00T00:00';
            } else {
                // 验证伴侣信息
                partnerName = document.getElementById('partnerName').value;
                partnerQQ = document.getElementById('partnerQQ').value;
                partnerBirth = document.getElementById('partnerBirth').value;
                anniversary = document.getElementById('anniversary').value;
                
                if (!partnerName) {
                    alert('请输入伴侣姓名');
                    return;
                }
                if (!partnerQQ) {
                    alert('请输入伴侣QQ号码');
                    return;
                }
                if (!partnerBirth) {
                    alert('请输入伴侣生日');
                    return;
                }
                if (!anniversary) {
                    alert('请输入恋爱纪念日');
                    return;
                }
            }

            // 构建请求数据
            const requestData = {
                male: {
                    name: '',
                    qq: '',
                    birth: ''
                },
                female: {
                    name: '',
                    qq: '',
                    birth: ''
                },
                anniversary: anniversary
            };

            // 确定性别分配
            let myGender = 'male';
            document.querySelectorAll('input[name="myGender"]').forEach(radio => {
                if (radio.checked) {
                    myGender = radio.value;
                }
            });

            if (myGender === 'male') {
                requestData.male = {
                    name: myName,
                    qq: myQQ,
                    birth: myBirth
                };
                requestData.female = {
                    name: partnerName,
                    qq: partnerQQ,
                    birth: partnerBirth
                };
            } else {
                requestData.female = {
                    name: myName,
                    qq: myQQ,
                    birth: myBirth
                };
                requestData.male = {
                    name: partnerName,
                    qq: partnerQQ,
                    birth: partnerBirth
                };
            }

            // 设置提交状态
            isSubmitting = true;
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '添加中...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`https://jnr-api.lvxin.xn--6qq986b3xl/api/add?password=${encodeURIComponent(adminPassword)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();
                
                if (result.success) {
                    alert('添加成功！');
                    window.location.href = 'index.html';
                } else {
                    alert('添加失败：' + (result.error || '未知错误'));
                    // 重置提交状态
                    isSubmitting = false;
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert('网络错误：' + error.message);
                // 重置提交状态
                isSubmitting = false;
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
