<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能步数管理器</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 自定义背景层 -->
    <div class="custom-bg"></div>
    
    <!-- 粒子背景效果 -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <!-- 高级光晕效果 -->
    <div class="light-effects">
        <div class="light-orb orb-1"></div>
        <div class="light-orb orb-2"></div>
        <div class="light-orb orb-3"></div>
        <div class="light-orb orb-4"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-walking"></i>
                <h1>智能步数管理器</h1>
            </div>
            <div class="subtitle">轻松管理您的运动数据</div>
        <div class="settings-btn" onclick="openSettings()">
            <i class="fas fa-cog"></i>
        </div>
    </div>

        <div class="main-card neon-border">
            <div class="card-header">
                <h2><i class="fas fa-chart-line"></i> 步数录入</h2>
            </div>
            
            <form id="stepForm" class="form-container">
                <div class="form-group">
                    <label for="account">
                        <i class="fas fa-user"></i>
                        账号
                    </label>
                    <input type="text" id="account" name="account" placeholder="请输入您的账号" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        密码
                    </label>
                    <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
                </div>

                <div class="form-group">
                    <label for="steps">
                        <i class="fas fa-shoe-prints"></i>
                        目标步数（可选）
                    </label>
                    <input type="text" id="steps" name="steps" placeholder="如: 8000 或 5000-10000，留空则随机">
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i>
                    提交步数
                </button>
            </form>
        </div>

        <!-- 结果卡片已移至弹窗，此行可删 -->

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h3>快速响应</h3>
                <p>秒级响应，即时更新您的步数数据</p>
            </div>

            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3>安全可靠</h3>
                <p>采用加密传输，保护您的账号安全</p>
            </div>

            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <h3>移动友好</h3>
                <p>完美适配各种设备，随时随地使用</p>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2024 智能步数管理器 | 让运动更简单</p>
        </div>
    </div>

    <!-- 美化弹窗 -->
    <div id="resultModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h3 class="modal-title">提交结果</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-content">
                <div id="modalResult" class="result-details"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-primary" onclick="closeModal()">
                    <i class="fas fa-check"></i>
                    确定
                </button>
                <button class="modal-btn modal-btn-secondary" onclick="resetForm()">
                    <i class="fas fa-redo"></i>
                    继续提交
                </button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>正在处理中...</p>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-icon">
                    <i class="fas fa-cog"></i>
                </div>
                <h3 class="modal-title">界面设置</h3>
                <button class="modal-close" onclick="closeSettings()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-content">
                <div class="settings-section">
                    <h4><i class="fas fa-image"></i> 背景设置</h4>
                    <div class="setting-item">
                        <label for="bgPresetSelect">背景选择:</label>
                        <select id="bgPresetSelect" onchange="applyBgPreset(this.value)">
                            <option value="default">默认渐变</option>
                            <option value="custom">精美背景</option>
                            <option value="solid">纯色背景</option>
                            <option value="none">无背景</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="bgOpacity">背景透明度:</label>
                        <input type="range" id="bgOpacity" min="0" max="100" value="100" onchange="updateBgOpacity(this.value)">
                        <span id="opacityValue">100%</span>
                    </div>
                </div>
                <div class="settings-section">
                    <h4><i class="fas fa-palette"></i> 毛玻璃效果</h4>
                    <div class="setting-item">
                        <label class="switch">
                            <input type="checkbox" id="glassEffect" checked onchange="toggleGlassEffect()">
                            <span class="slider"></span>
                        </label>
                        <span>启用毛玻璃效果</span>
                    </div>
                    <div class="setting-item">
                        <label for="glassBlur">模糊强度:</label>
                        <input type="range" id="glassBlur" min="5" max="50" value="25" onchange="updateGlassBlur(this.value)">
                        <span id="blurValue">25px</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-primary" onclick="saveSettings()">
                    <i class="fas fa-save"></i>
                    保存设置
                </button>
                <button class="modal-btn modal-btn-secondary" onclick="resetSettings()">
                    <i class="fas fa-undo"></i>
                    重置默认
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
